kind = "web"
previewPath = "/"
title = "تشيكنييز — Chickenees Prototype"
version = "1.0.0"
id = "artifacts/chickenees"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21078

[services.development]
run = "pnpm --filter @workspace/chickenees run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chickenees", "run", "build" ]
publicDir = "artifacts/chickenees/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21078"
BASE_PATH = "/"
